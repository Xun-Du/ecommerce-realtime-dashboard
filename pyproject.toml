[project]
name = "ecommerce-realtime-dashboard"
version = "0.1.0"
description = "Real-time e-commerce A/B testing and attribution dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<7.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "scipy>=1.14,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "streamlit>=1.40,<2.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
lint = "scripts.commands:lint"
test = "scripts.commands:test"
run-api = "scripts.commands:run_api"
run-dashboard = "scripts.commands:run_dashboard"
run-simulator = "scripts.commands:run_simulator"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend", "scripts"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build_prd_docx.py", "docs/build_prd_docx.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["backend", "frontend", "scripts"]
